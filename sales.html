<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concession Daily Sales Sheet</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f0f2f5; padding: 10px; color: #333; }
        .container { max-width: 1250px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .page-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-bottom: 12px; 
            margin-bottom: 15px; 
            border-bottom: 2px solid #e2e8f0; 
            gap: 10px;
        }
        .page-header h2 { font-size: 16px; color: #0f172a; font-weight: 700; margin: 0; }
        .nav-btn { background: #16a34a; color: white; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 12px; white-space: nowrap; }
        .btn-pdf { background-color: #dc2626; color: white; padding: 6px 12px; font-size: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; }
        
        .card { background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 15px; }
        .shift-badge { background-color: #fef3c7; color: #92400e; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        
        .table-responsive { width: 100%; overflow-x: auto; border-radius: 6px; border: 1px solid #cbd5e1; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 700px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
        th { background-color: #0f172a; color: white; position: sticky; top: 0; }
        
        .inp-qty { width: 75px; padding: 5px; border: 1px solid #94a3b8; border-radius: 4px; font-weight: bold; text-align: center; }
        .inp-qty:focus { border-color: #2563eb; outline: none; background: #eff6ff; }
        
        .closing-cell { font-weight: bold; color: #1e293b; font-size: 13px; }
        .btn-save { background: #ea580c; color: white; padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; width: 100%; margin-top: 15px; transition: 0.2s; }
        .btn-save:hover { background: #c2410c; }
        
        @media print {
            .page-header, .shift-badge, .btn-save, .btn-pdf { display: none !important; }
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; padding: 0; }
            .inp-qty { border: none; background: transparent; text-align: left; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="page-header">
        <h2>🍿 Concession Daily Sales Sheet</h2>
        <div>
            <button class="btn-pdf" onclick="window.print()">📄 Print / PDF</button>
            <a href="index.html" class="nav-btn">⬅ Store Inventory</a>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <div class="shift-badge">⏰ Operational Shift: 6:00 AM - 5:59 AM Next Day</div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <label style="font-size: 12px; font-weight: bold;">Date:</label>
                <input type="date" id="salesDate" style="padding: 5px 8px; border-radius: 4px; border: 1px solid #cbd5e1; font-weight: bold;">
            </div>
        </div>

        <form id="bulkSalesForm">
            <div class="table-responsive" style="margin-top: 10px; max-height: 70vh;">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Item / Combo Name</th>
                            <th>Opening</th>
                            <th>Stock IN</th>
                            <th>Today Sale (Input)</th>
                            <th>Closing Balance</th>
                        </tr>
                    </thead>
                    <tbody id="salesTableBody"></tbody>
                </table>
            </div>
            <button type="submit" class="btn-save">💾 Save All Daily Sales Entries to Google Sheet</button>
        </form>
    </div>
</div>

<script>
    const MANAGER_PASS = "George1919//";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVzucilfR9yf4vy0Vb11fWBxwwaxMyPIxzpnfyu-Lv4oCrb5UygzNyJkBaGVxuaKmE/exec";

    function getOperationalDate() {
        const now = new Date();
        const hours = now.getHours();
        if (hours < 6) now.setDate(now.getDate() - 1);
        return now.toISOString().split('T')[0];
    }

    document.getElementById('salesDate').value = getOperationalDate();

    // 31 Concession Items List
    const concessionItemsList = [
        "POPCORN (Popcorn Cup)",
        "COMBO A (1 Popcorn, 2 Soft drinks, 1 Snack)",
        "COMBO B (1 Popcorn, 1 Soft drink)",
        "COMBO C (1 Popcorn, 2 Soft drinks)",
        "COMBO D (1 Popcorn, 1 Soft drink, 1 Mineral Water)",
        "FAMILY COMBO (2 Popcorn, 4 Soft drinks)",
        "MINERAL WATER",
        "BOTTLE DRINKS (F&N / 100 Plus)",
        "SOFT DRINKS (22oz Cup & Lid)",
        "NESCAFE (8oz Hot Cup & Lid)",
        "HOT MILO (8oz Hot Cup & Lid)",
        "MASALA TEA (8oz Hot Cup & Lid)",
        "MILO ICE (Milo Cold Cup & Lid)",
        "ASAM BOI",
        "CHIPSTER",
        "SUPER RINGS",
        "TWISTIES",
        "THUMBS",
        "MAMEE MONSTER",
        "FRENCH FRIES (Fries + Meals box)",
        "CHICKEN POPCORN (Chicken Popcorn + Meals box)",
        "CHICKEN NUGGETS (Nuggets + Meals box)",
        "MINI SAUSAGE (Mini Sausage + Meals box)",
        "ONION RINGS (Onion Rings + Meals box)",
        "CHEESE WEDGES (Cheese Wedges + Meals box)",
        "CORNDOUGH CHEESE (Corndough + Meals box)",
        "NACHOS CHEESE (Nachos Cheese + Meals box)",
        "KARIPAP (Karipap + Meals box)",
        "MEDU VADAI (Vadai + Meals box)",
        "SWEET CORN (Sweet corn + Cup & Lid)",
        "AYAM GUNTING (Ayam Gunting + Meals box)"
    ];

    function renderSalesGrid() {
        const tbody = document.getElementById('salesTableBody');
        tbody.innerHTML = '';

        concessionItemsList.forEach((itemName, index) => {
            tbody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td><b>${itemName}</b></td>
                    <td id="op_${index}">0</td>
                    <td><input type="number" id="in_${index}" class="inp-qty" value="0" min="0" oninput="calcClosing(${index})"></td>
                    <td><input type="number" id="sale_${index}" class="inp-qty" value="0" min="0" style="border-color: #ea580c; background: #fff7ed;" oninput="calcClosing(${index})"></td>
                    <td id="close_${index}" class="closing-cell">0</td>
                </tr>
            `;
        });
    }

    function calcClosing(index) {
        const opening = parseInt(document.getElementById(`op_${index}`).textContent) || 0;
        const stockIn = parseInt(document.getElementById(`in_${index}`).value) || 0;
        const todaySale = parseInt(document.getElementById(`sale_${index}`).value) || 0;
        const closing = opening + stockIn - todaySale;
        
        const closeElem = document.getElementById(`close_${index}`);
        closeElem.textContent = closing;
        closeElem.style.color = closing < 0 ? '#dc2626' : '#1e293b';
    }

    function verifyPassword() {
        return prompt("Enter Manager Password:") === MANAGER_PASS ? true : (alert("Incorrect Password!"), false);
    }

    document.getElementById('bulkSalesForm').addEventListener('submit', (e) => {
        e.preventDefault();
        if (!verifyPassword()) return;

        const date = document.getElementById('salesDate').value;
        let entriesToSave = [];

        concessionItemsList.forEach((itemName, index) => {
            const opening = parseInt(document.getElementById(`op_${index}`).textContent) || 0;
            const stockIn = parseInt(document.getElementById(`in_${index}`).value) || 0;
            const todaySale = parseInt(document.getElementById(`sale_${index}`).value) || 0;
            const closing = opening + stockIn - todaySale;

            // Save entries that have sales or stock in
            if (todaySale > 0 || stockIn > 0) {
                entriesToSave.push({
                    action: "add_sales",
                    date: date,
                    itemName: itemName,
                    category: "Concession",
                    opening: opening,
                    stockIn: stockIn,
                    todaySale: todaySale,
                    closing: closing
                });
            }
        });

        if (entriesToSave.length === 0) {
            alert("No Sales or Stock IN entries recorded!");
            return;
        }

        // Send data to Google Apps Script
        if (SCRIPT_URL) {
            entriesToSave.forEach(payload => {
                fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            });
        }

        alert(`Successfully saved ${entriesToSave.length} Sales entries to Google Sheet!`);
    });

    document.addEventListener('DOMContentLoaded', () => {
        renderSalesGrid();
    });
</script>

</body>
</html>
