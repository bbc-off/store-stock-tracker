<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockbuster Perling Store Stock Tracker</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f0f2f5; padding: 10px; color: #333; }
        .container { max-width: 1250px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .top-nav { background: #1e293b; color: white; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; }
        .top-nav h2 { font-size: 18px; margin: 0; }
        
        /* 🏷️ Floating Side Tab (File Index Style) */
        .side-tab-btn {
            position: fixed;
            right: 0;
            top: 35%;
            transform: translateY(-50%);
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 14px 10px;
            border-radius: 10px 0 0 10px;
            font-weight: bold;
            font-size: 13px;
            box-shadow: -3px 4px 12px rgba(0,0,0,0.3);
            z-index: 9999;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            letter-spacing: 0.5px;
            border: 2px solid #ffffff;
            border-right: none;
            transition: all 0.2s ease;
        }
        .side-tab-btn:hover, .side-tab-btn:active {
            background: #1d4ed8;
            padding-left: 14px;
        }

        .grid-layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
        @media (max-width: 900px) {
            body { padding: 5px; } .container { padding: 12px; } .grid-layout { grid-template-columns: 1fr; }
            .toolbar { flex-direction: column; align-items: flex-start !important; }
            .toolbar-btns { display: flex; flex-wrap: wrap; gap: 5px; width: 100%; }
        }
        .card { background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 15px; }
        .card h3 { margin-bottom: 12px; color: #0f172a; font-size: 14px; border-bottom: 2px solid #cbd5e1; padding-bottom: 6px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 12px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-success { background-color: #16a34a; color: white; }
        .btn-purple { background-color: #9333ea; color: white; }
        .btn-excel { background-color: #15803d; color: white; padding: 8px 10px; font-size: 12px; }
        .btn-pdf { background-color: #dc2626; color: white; padding: 8px 10px; font-size: 12px; }
        
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; }
        .table-responsive { width: 100%; overflow-x: auto; margin-top: 5px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .category-header { background-color: #334155; color: #fff; font-weight: bold; padding: 8px 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 500px; }
        th, td { padding: 7px 9px; text-align: left; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
        th { background-color: #1e293b; color: white; }
        .tag-in { color: #16a34a; font-weight: bold; }
        .tag-out { color: #dc2626; font-weight: bold; }
        .status-green { background-color: #dcfce7; color: #15803d; padding: 3px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .status-yellow { background-color: #fef9c3; color: #a16207; padding: 3px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .status-red { background-color: #fee2e2; color: #b91c1c; padding: 3px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<!-- 🏷️ Floating Side Tab (File Organizer Index Style) -->
<a href="sales.html" class="side-tab-btn">
    🍿 CONCESSION SALES ➔
</a>

<div class="container">
    <div class="top-nav">
        <h2>🎬 Store Stock Inventory Tracker</h2>
    </div>

    <div class="grid-layout">
        <div>
            <div class="card">
                <h3>🔄 1. Daily In / Out / Transfer Log</h3>
                <form id="transForm">
                    <div class="form-group"><label>Date</label><input type="date" id="transDate" required></div>
                    <div class="form-group"><label>Select Item</label><select id="transItemSelect" required><option value="">-- Select Item --</option></select></div>
                    <div class="form-group"><label>Type / Destination</label><select id="transType" required><option value="IN">IN (Stock Received)</option><option value="OUT">OUT (General Usage / Transfer to Concession)</option><option value="PELANGI">TO PELANGI</option></select></div>
                    <div class="form-group"><label>Quantity</label><input type="number" id="transQty" min="1" placeholder="0" required></div>
                    <button type="submit" class="btn btn-success">Save Entry</button>
                </form>
            </div>

            <div class="card">
                <h3>⚙️ 2. Set Opening Stock</h3>
                <form id="addItemForm">
                    <div class="form-group"><label>Category</label><select id="newCat" onchange="populateItemDropdown()" required><option value="">-- Select Category --</option><option value="POPCORN">POPCORN</option><option value="Snacks">Snacks</option><option value="Meals items">Meals items</option><option value="Cups">Cups</option><option value="BOTTLE Drinks">BOTTLE Drinks</option><option value="BIB">BIB</option></select></div>
                    <div class="form-group"><label>Item Name</label><select id="newItemSelect" required><option value="">-- Select Category First --</option></select></div>
                    <div class="form-group"><label>Opening Stock</label><input type="number" id="newOpeningStock" min="0" value="0" required></div>
                    <button type="submit" class="btn btn-primary">Update Opening Stock</button>
                </form>
            </div>

            <div class="card">
                <h3>➕ 3. Add New Item to Category</h3>
                <form id="addNewItemForm">
                    <div class="form-group"><label>Select Category</label><select id="addCustomCat" required><option value="">-- Select Category --</option><option value="POPCORN">POPCORN</option><option value="Snacks">Snacks</option><option value="Meals items">Meals items</option><option value="Cups">Cups</option><option value="BOTTLE Drinks">BOTTLE Drinks</option><option value="BIB">BIB</option></select></div>
                    <div class="form-group"><label>New Item Name</label><input type="text" id="addCustomName" placeholder="e.g. Cheese Popcorn" required></div>
                    <div class="form-group"><label>Initial Opening Stock</label><input type="number" id="addCustomOpening" min="0" value="0" required></div>
                    <button type="submit" class="btn btn-purple">Add Item to Inventory</button>
                </form>
            </div>
        </div>

        <div>
            <div class="toolbar">
                <h3>📊 Inventory Summary Board</h3>
                <div class="toolbar-btns">
                    <button class="btn btn-excel" onclick="exportToExcel()">📊 Excel (31-Day)</button>
                    <button class="btn btn-pdf" onclick="window.print()">📄 Print PDF</button>
                </div>
            </div>

            <div class="table-responsive">
                <table id="stockTable">
                    <thead><tr><th>Item Name</th><th>Opening</th><th>Total IN</th><th>Total OUT</th><th>Closing Stock</th><th>Status</th></tr></thead>
                    <tbody id="stockTableBody"></tbody>
                </table>
            </div>

            <h3 style="margin-top: 25px; margin-bottom: 10px;">📋 Daily Transaction Log</h3>
            <div class="table-responsive">
                <table id="logTable">
                    <thead><tr><th>Date</th><th>Item</th><th>Type</th><th>Quantity</th><th>Running Balance</th></tr></thead>
                    <tbody id="logTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
